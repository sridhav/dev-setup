# The whole Cornea Light palette, pinned.
#
# Designed to the targets in CORNEA.md rather than synthesised: all 26 names
# are set here, so sh/gen-theme.py's ramp and contrast pass decide nothing.
# Lc is APCA contrast against BASE (negative = light text on dark). Run
# `sh/check-cornea.py` after any change.
#
# Six hue families only. The Catppuccin names with no family of their own
# reuse the nearest one, so the screen never carries more than six hues.

BASE      = #efede8   # the page: Ghostty, tmux and Neovim all paint this
MANTLE    = #e7e5e0   # Neovim bars
CRUST     = #e0ded9
TEXT      = #242320   # Lc +92  body text
SUBTEXT1  = #373633   # Lc +87
SUBTEXT0  = #454340   # Lc +82
OVERLAY2  = #555450   # Lc +76  comments
OVERLAY1  = #63625e   # Lc +70
OVERLAY0  = #73726e   # Lc +63  faintest text: line numbers
SURFACE2  = #c5c3be   # Lc +22
SURFACE1  = #d1d0cb   # Lc +14  selection
SURFACE0  = #dbd9d4   # Lc +9  prompt and tmux bubbles
BLUE      = #0f4a81   # Lc +80  blue
LAVENDER  = #0f4a81   # Lc +80  = blue
SAPPHIRE  = #035154   # Lc +80  = cyan
SKY       = #035154   # Lc +80  = cyan
TEAL      = #035154   # Lc +80  cyan
GREEN     = #11541a   # Lc +80  green
YELLOW    = #624201   # Lc +80  amber
PEACH     = #624201   # Lc +80  = amber
RED       = #7c2d2b   # Lc +80  red
MAROON    = #7c2d2b   # Lc +80  = red
PINK      = #603777   # Lc +80  = violet
FLAMINGO  = #7c2d2b   # Lc +80  = red
ROSEWATER = #624201   # Lc +80  = amber
MAUVE     = #603777   # Lc +80  violet
