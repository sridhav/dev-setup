# The whole Cornea Dark palette, pinned.
#
# Designed to the targets in CORNEA.md rather than synthesised: all 26 names
# are set here, so sh/gen-theme.py's ramp and contrast pass decide nothing.
# Lc is APCA contrast against BASE (negative = light text on dark). Run
# `sh/check-cornea.py` after any change.
#
# Six hue families only. The Catppuccin names with no family of their own
# reuse the nearest one, so the screen never carries more than six hues.

BASE      = #1f1d1b   # the page: Ghostty, tmux and Neovim all paint this
MANTLE    = #191715   # Neovim bars
CRUST     = #151311
TEXT      = #d3cfcc   # Lc -76  body text
SUBTEXT1  = #c8c5c1   # Lc -70
SUBTEXT0  = #c0bdb9   # Lc -65
OVERLAY2  = #b3b0ad   # Lc -58  comments
OVERLAY1  = #a5a29e   # Lc -50
OVERLAY0  = #979390   # Lc -43  faintest text: line numbers
SURFACE2  = #3e3c3a
SURFACE1  = #34322f   # selection
SURFACE0  = #2b2927   # prompt and tmux bubbles
BLUE      = #9ac0ec   # Lc -65  blue
LAVENDER  = #9ac0ec   # Lc -65  = blue
SAPPHIRE  = #7ec9cd   # Lc -65  = cyan
SKY       = #7ec9cd   # Lc -65  = cyan
TEAL      = #7ec9cd   # Lc -65  cyan
GREEN     = #9dc89d   # Lc -65  green
YELLOW    = #d8b887   # Lc -65  amber
PEACH     = #d8b887   # Lc -65  = amber
RED       = #edada7   # Lc -65  red
MAROON    = #edada7   # Lc -65  = red
PINK      = #cfb2e3   # Lc -65  = violet
FLAMINGO  = #edada7   # Lc -65  = red
ROSEWATER = #d8b887   # Lc -65  = amber
MAUVE     = #cfb2e3   # Lc -65  violet
