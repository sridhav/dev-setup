# Ghostty: macOS-only settings. Linked as ~/.config/ghostty/platform.conf.
# Linux equivalents are in linux.conf (Cmd → Ctrl+Shift, Cmd+Shift → Ctrl+Shift+Alt).

# Thickening blurs strokes on a Retina display; keep text crisp instead.
font-thicken = false
macos-titlebar-style = transparent

# Tabs
keybind = cmd+t=new_tab
keybind = cmd+shift+left=previous_tab
keybind = cmd+shift+right=next_tab
keybind = cmd+w=close_surface

# Splits
keybind = cmd+d=new_split:right
keybind = cmd+shift+d=new_split:down
# Move between tmux panes and Neovim splits, not Ghostty's own splits (we split
# with tmux). tmux has no Cmd modifier at all, so Ghostty translates the key
# into the Ctrl+Shift+arrow sequence (CSI 1;6<A-D>) that tmux and Neovim bind.
keybind = cmd+alt+left=csi:1;6D
keybind = cmd+alt+right=csi:1;6C
keybind = cmd+alt+up=csi:1;6A
keybind = cmd+alt+down=csi:1;6B
keybind = cmd+shift+e=equalize_splits
keybind = cmd+shift+f=toggle_split_zoom

# Font size
keybind = cmd+plus=increase_font_size:1
keybind = cmd+minus=decrease_font_size:1
keybind = cmd+zero=reset_font_size

# Quick terminal global hotkey
keybind = global:ctrl+grave_accent=toggle_quick_terminal

# Reload config
keybind = cmd+shift+comma=reload_config
