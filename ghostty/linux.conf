# Ghostty: Linux-only settings. Linked as ~/.config/ghostty/platform.conf.
# Same actions as macos.conf. Cmd → Ctrl+Shift, Cmd+Shift → Ctrl+Shift+Alt,
# because plain Ctrl+<key> belongs to the shell and Neovim.

# Tabs
keybind = ctrl+shift+t=new_tab
keybind = ctrl+shift+alt+left=previous_tab
keybind = ctrl+shift+alt+right=next_tab
keybind = ctrl+shift+w=close_surface

# Splits
keybind = ctrl+shift+d=new_split:right
keybind = ctrl+shift+alt+d=new_split:down
keybind = ctrl+alt+left=goto_split:left
keybind = ctrl+alt+right=goto_split:right
keybind = ctrl+alt+up=goto_split:top
keybind = ctrl+alt+down=goto_split:bottom
keybind = ctrl+shift+alt+e=equalize_splits
keybind = ctrl+shift+alt+f=toggle_split_zoom

# Font size
keybind = ctrl+plus=increase_font_size:1
keybind = ctrl+minus=decrease_font_size:1
keybind = ctrl+zero=reset_font_size

# Quick terminal hotkey. Global hotkeys on Linux depend on the desktop's
# portal support; if it doesn't fire, bind `ghostty +toggle-quick-terminal`
# (or just `ghostty`) to Ctrl+` in the desktop's keyboard settings.
keybind = global:ctrl+grave_accent=toggle_quick_terminal

# Reload config
keybind = ctrl+shift+comma=reload_config
