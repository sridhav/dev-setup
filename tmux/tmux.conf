unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-s

set -g mouse on

# Tell Neovim when the pane gains/loses focus, so it notices files changed on
# disk (autoread).
set -g focus-events on

# Scrollback: 50k lines per pane (default 2000). Scroll/copy with vi keys, like
# Neovim: Ctrl-u/d, j/k, g/G, / to search, v to select, y to copy.
set -g history-limit 50000
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Thin Catppuccin Mocha scrollbar (surface0 track, mauve thumb), shown only
# while scrolled back.
set -g pane-scrollbars modal
set -g pane-scrollbars-style "bg=#313244,fg=#cba6f7,width=1"

set-option -g status-position top

# Split with the leader and an arrow: the arrow points at where the new pane
# lands. -b puts it before (left/above) the current one. This replaces tmux's
# default prefix+arrow pane selection, which Ctrl-h/j/k/l already covers with
# no prefix. -c keeps the new pane in the directory you were already in.
bind -T prefix Left  split-window -h -b -c "#{pane_current_path}"
bind -T prefix Right split-window -h    -c "#{pane_current_path}"
bind -T prefix Up    split-window -v -b -c "#{pane_current_path}"
bind -T prefix Down  split-window -v    -c "#{pane_current_path}"

# Same for a new window: start where you already are, not where the session
# was first opened.
bind c new-window -c "#{pane_current_path}"

# Own the terminal title. Without this tmux never updates it, so Ghostty's
# titlebar stays frozen on whatever it was when the window started (often
# tmux's default pane title, which is the hostname). #W = tmux window name.
set -g set-titles on
set -g set-titles-string "#W"

set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.tmux/plugins/tpm/tpm'

set -g @catppuccin_flavor "mocha"

set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
# v2 option name. The v1 name (@catppuccin_window_default_text) is ignored, and
# v2 then falls back to its default " #T" -- the pane title, i.e. the hostname.
set -g @catppuccin_window_text "#W "

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W "

set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text "#{pane_current_path}"

# Run catppuccin plugin manually or through tpm
# ...

set -g status-left ""
set -g  status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"
