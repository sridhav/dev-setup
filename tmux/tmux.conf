unbind r
# Reload the config, then renumber the open windows (base-index only applies to
# new windows, so this moves an old 0, 1, 2 to 1, 2, 3).
bind r source-file ~/.tmux.conf \; move-window -r

set -g prefix C-s

# Number windows and panes from 1, matching the keyboard (1 is leftmost), and
# close the gaps when a window is closed.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g mouse on

# Tell Neovim when the pane gains/loses focus, so it notices files changed on
# disk (autoread).
set -g focus-events on

# Pass Ghostty's curly, colored underlines (errors, spell check) through to
# Neovim instead of a plain underline, and send modified keys such as
# Shift-Enter as themselves to apps that ask for them.
set -as terminal-features 'xterm-ghostty:usstyle:extkeys'
set -s extended-keys on

# Scrollback: 50k lines per pane (default 2000). Scroll/copy with vi keys, like
# Neovim: Ctrl-u/d, j/k, g/G, / to search, v to select, y to copy.
set -g history-limit 50000
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Thin Catppuccin Mocha scrollbar (surface0 track, mauve thumb), shown only
# while scrolled back.
set -g pane-scrollbars modal
set -g pane-scrollbars-style "bg=#313244,fg=#cba6f7,width=1"

set-option -g status-position top

# Split with the leader and an arrow: the arrow points at where the new pane
# lands. -b puts it before (left/above) the current one. This replaces tmux's
# default prefix+arrow pane selection, which Ctrl-h/j/k/l already covers with
# no prefix. -c keeps the new pane in the directory you were already in.
bind -T prefix Left  split-window -h -b -c "#{pane_current_path}"
bind -T prefix Right split-window -h    -c "#{pane_current_path}"
bind -T prefix Up    split-window -v -b -c "#{pane_current_path}"
bind -T prefix Down  split-window -v    -c "#{pane_current_path}"

# Same for a new window: start where you already are, not where the session
# was first opened.
bind c new-window -c "#{pane_current_path}"

# Own the terminal title. Without this tmux never updates it, so Ghostty's
# titlebar stays frozen on whatever it was when the window started (often
# tmux's default pane title, which is the hostname). #W = tmux window name.
set -g set-titles on
set -g set-titles-string "#W"

set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.tmux/plugins/tpm/tpm'

set -g @catppuccin_flavor "mocha"

# The bar is drawn here, not by catppuccin's modules, so it matches Neovim's
# bottom bar (nvim/lua/plugins/lualine.lua): rounded bubbles on the mantle
# background, each kind of item in the same color in both. Windows on the left
# (the current one green, like Neovim's TERMINAL bubble; 󰁌 when zoomed), the
# directory (peach, like Neovim's project folder) and session on the right.
# The session bubble is pink and turns red while the prefix (Ctrl-s) is held,
# the way Neovim's mode bubble changes color. Colors are catppuccin's @thm_* (Mocha); set after the plugin
# runs so these win.
set -gF status-style "bg=#{@thm_mantle},fg=#{@thm_fg}"
set -g status-left ""
set -g status-right-length 100
set -g window-status-separator " "
set -g window-status-format "#[fg=#{@thm_surface_0},bg=#{@thm_mantle}]#[fg=#{@thm_overlay_2},bg=#{@thm_surface_0}] #I #W#{?window_zoomed_flag, 󰁌,}#[fg=#{@thm_surface_0},bg=#{@thm_mantle}]"
set -g window-status-current-format "#[fg=#{@thm_green},bg=#{@thm_mantle}]#[fg=#{@thm_crust},bg=#{@thm_green},bold] #I #W#{?window_zoomed_flag, 󰁌,}#[fg=#{@thm_green},bg=#{@thm_mantle},nobold]"
set -g status-right "#[fg=#{@thm_surface_0},bg=#{@thm_mantle}]#[fg=#{@thm_peach},bg=#{@thm_surface_0}] #{pane_current_path} #[fg=#{?client_prefix,#{@thm_red},#{@thm_pink}},bg=#{@thm_surface_0}]#[fg=#{@thm_crust},bg=#{?client_prefix,#{@thm_red},#{@thm_pink}},bold] #S#[fg=#{?client_prefix,#{@thm_red},#{@thm_pink}},bg=#{@thm_mantle},nobold]"
